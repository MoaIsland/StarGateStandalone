bind:
  # Keep this on the loopback address unless the StarGate server has to be reached
  # from another host. Authentication is a single shared password, so a public bind
  # means anyone who can reach the port can join the server mesh.
  address: 127.0.0.1
  port: 47007

auth:
  # Must match the password configured on every StarGate client.
  password: CHANGE_ME
  # When a client authenticates with a name that a connected session already holds, the new
  # connection is refused (its DisconnectPacket reason starts with NAME_TAKEN) and the session
  # that connected first keeps the name. A session that has closed gives its name up at once.
  # With false, both connect under the same name and split the traffic meant for it.
  block-same-names: true

debug: false
